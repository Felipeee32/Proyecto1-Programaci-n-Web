<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estación Arcade</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
    <h1>🎮 Estación Arcade</h1>
</header>

<section class="juegos">
    <h2>Videojuegos Destacados</h2>

    <div class="card">
        <img src="img/juego1.jpg">
        <h3>Cyberpunk 2077</h3>
    </div>

    <div class="card">
        <img src="img/juego2.jpg">
        <h3>God of War</h3>
    </div>

    <div class="card">
        <img src="img/juego3.jpg">
        <h3>FIFA 24</h3>
    </div>
</section>

<section class="videos">
    <h2>Trailers</h2>

    <video controls src="videos/video1.mp4"></video>
    <video controls src="videos/video2.mp4"></video>

    <iframe width="300" height="200"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        allowfullscreen>
    </iframe>
</section>

<section class="formulario">
    <h2>Contacto</h2>

    <form action="contacto.html">
        <input type="text" placeholder="Nombre" required>
        <input type="email" placeholder="Correo" required>
        <textarea placeholder="Mensaje" required></textarea>
        <button type="submit">Enviar</button>
    </form>
</section>

</body>
</html>
