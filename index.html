<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Estación Arcade</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
    <h1>Estación Arcade</h1>
</header>

<section class="juegos">
    <h2>Juegos de la Semana</h2>

    <div class="card">
        <img src="img/juego1.jpg">
        <h3>Hollow Knight</h3>
    </div>

    <div class="card">
        <img src="img/juego2.jpg">
        <h3>Enter the Gungeon</h3>
    </div>

    <div class="card">
        <img src="img/juego3.jpg">
        <h3>Stumble Guys</h3>
    </div>
</section>

<section class="videos">
    <h2>Videos/Gameplays</h2>

    <video controls src="videos/video1.mp4"></video>
    <video controls src="videos/video2.mp4"></video>

    <iframe width="560" height="315" 
    src="https://www.youtube.com/watch?v=RCq7VGOuyig" 
    frameborder="0" 
    allowfullscreen>
    </iframe>
</section>

<section class="formulario">
    <h2>Contacto</h2>

    <form action="contacto.html">
        <input type="text" placeholder="Nombre" required>
        <input type="email" placeholder="Correo" required>
        <textarea placeholder="Mensaje" required></textarea>
        <button type="submit">Enviar</button>
    </form>
</section>

</body>
</html>
